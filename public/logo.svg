<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Top Word: NEON (Magenta Pink) -->
  <text x="250" y="170" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="106" fill="#f500d4" letter-spacing="2" filter="url(#shadow)">NEON</text>

  <!-- Middle Word: GLOW (Black pill with Electric Green) -->
  <g filter="url(#shadow)">
    <rect x="62" y="196" width="376" height="116" rx="22" fill="#000000" stroke="#00ff33" stroke-width="2" stroke-opacity="0.3" />
    <text x="250" y="284" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="96" fill="#00ff33" letter-spacing="3">GLOW</text>
  </g>

  <!-- Bottom Word: EFFECT (Vivid Red) -->
  <text x="250" y="426" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="94" fill="#eb212d" letter-spacing="2" filter="url(#shadow)">EFFECT</text>
</svg>
